name: Deploy Supabase functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/deploy-supabase.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    # Live functions only ever come from main, including manual runs.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Gmail functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy gmail-oauth-start --project-ref "${{ vars.SUPABASE_PROJECT_ID }}"
          supabase functions deploy gmail-oauth-callback --no-verify-jwt --project-ref "${{ vars.SUPABASE_PROJECT_ID }}"
          supabase functions deploy gmail-search --project-ref "${{ vars.SUPABASE_PROJECT_ID }}"
          supabase functions deploy opportunity-discover --project-ref "${{ vars.SUPABASE_PROJECT_ID }}"
          supabase functions deploy telegram-webhook --no-verify-jwt --project-ref "${{ vars.SUPABASE_PROJECT_ID }}"
          supabase functions deploy telegram-reminder-sweep --no-verify-jwt --project-ref "${{ vars.SUPABASE_PROJECT_ID }}"
          supabase functions deploy calendar-feed --no-verify-jwt --project-ref "${{ vars.SUPABASE_PROJECT_ID }}"
