name: Check Supabase functions

on:
  pull_request:
    paths:
      - "supabase/functions/**"
      - ".github/workflows/check-functions.yml"
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # Type errors in a function otherwise only show up after it is deployed.
      - name: Type-check every function
        run: deno check supabase/functions/*/index.ts
