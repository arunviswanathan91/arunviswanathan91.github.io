name: Deploy discovery worker

on:
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - ".github/workflows/deploy-discovery-worker.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: discovery-worker-deploy
  cancel-in-progress: true

jobs:
  deploy:
    # Configure these once (GCP_PROJECT_ID/GCP_SERVICE_ACCOUNT as repository
    # variables, GCP_WORKLOAD_IDENTITY_PROVIDER as a secret -- it's an
    # identity-federation resource path, sensitive enough to keep out of
    # vars). Keeping the guard makes a missing deployment identity a visible
    # skipped job, not a broken website.
    #
    # The secrets context cannot be referenced in a job-level `if:` --
    # GitHub Actions rejects the whole workflow run at parse time if it is
    # (silent skip -> hard failure with zero jobs). So this guard only
    # covers the two variables; if GCP_WORKLOAD_IDENTITY_PROVIDER itself is
    # missing, the auth step below fails loudly instead, which is still
    # better than an inexplicable "skipped" job.
    if: ${{ vars.GCP_PROJECT_ID != '' && vars.GCP_SERVICE_ACCOUNT != '' }}
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION || 'europe-west1' }}
      CLOUD_RUN_SERVICE: opportunity-discovery
      SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
      ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
      JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      CRAWL4AI_API_TOKEN: ${{ secrets.CRAWL4AI_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          # Secrets can't be read from a job-level `if:` (see the guard
          # above), but they're always fine to reference directly here.
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      # Deployed straight from the public Docker Hub image -- no build step,
      # no Cloud Build cost. Free-tier-shaped on purpose: min-instances 0
      # (scale to zero, no idle billing) and max-instances 1 (bounds
      # worst-case cost if it were ever hammered). CRAWL4AI_API_TOKEN is
      # optional and unset until you add it as a repo secret; Crawl4AI's
      # docker server is expected to require it as a bearer token on real
      # requests once set, but that contract was NOT verified against a live
      # instance from this sandbox (its network egress is restricted) --
      # confirm at "<url>/docs" after first deploy. Until that secret is
      # set, this service has no request-level auth of its own beyond
      # whatever the image itself defaults to.
      - name: Deploy Crawl4AI renderer
        if: vars.DISABLE_CRAWL4AI != 'true'
        shell: bash
        run: |
          set -euo pipefail
          extra_env=()
          if [ -n "${CRAWL4AI_API_TOKEN:-}" ]; then
            extra_env+=(--set-env-vars "CRAWL4AI_API_TOKEN=${CRAWL4AI_API_TOKEN}")
          fi
          gcloud run deploy crawl4ai-renderer \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --image docker.io/unclecode/crawl4ai:0.8.6 \
            --port 11235 \
            --memory 4Gi --cpu 2 \
            --min-instances 0 --max-instances 1 --concurrency 1 \
            --timeout 60 \
            --allow-unauthenticated \
            "${extra_env[@]}"
          crawl4ai_url="$(gcloud run services describe crawl4ai-renderer \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --format='value(status.url)')"
          echo "CRAWL4AI_URL=${crawl4ai_url}" >> "$GITHUB_ENV"
          echo "Deployed crawl4ai-renderer at ${crawl4ai_url} -- set this as the CRAWL4AI_URL repo variable so discover.yml's cron run (which does not go through this Cloud Run deploy) can use it too."

      - name: Build, test and deploy Cloud Run
        shell: bash
        run: |
          set -euo pipefail

          npm ci --no-audit --no-fund --prefix pipeline
          npm run check --prefix pipeline

          runtime_service_account="$(gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --format='value(spec.template.spec.serviceAccountName)' 2>/dev/null || true)"
          if [ -z "$runtime_service_account" ]; then
            project_number="$(gcloud projects describe "$GCP_PROJECT_ID" --format='value(projectNumber)')"
            runtime_service_account="${project_number}-compute@developer.gserviceaccount.com"
          fi

          secret_mappings=(
            "SUPABASE_SERVICE_ROLE_KEY=supabase-service-role-key:latest"
            "DISCOVERY_SHARED_SECRET=discovery-shared-secret:latest"
          )

          sync_secret() {
            secret_name="$1"
            env_name="$2"
            value="${!env_name:-}"
            if [ -z "$value" ]; then return; fi
            if ! gcloud secrets describe "$secret_name" --project "$GCP_PROJECT_ID" >/dev/null 2>&1; then
              gcloud secrets create "$secret_name" --project "$GCP_PROJECT_ID" --replication-policy=automatic
            fi
            printf '%s' "$value" | gcloud secrets versions add "$secret_name" \
              --project "$GCP_PROJECT_ID" --data-file=- >/dev/null
            gcloud secrets add-iam-policy-binding "$secret_name" --project "$GCP_PROJECT_ID" \
              --member="serviceAccount:${runtime_service_account}" \
              --role=roles/secretmanager.secretAccessor >/dev/null
            secret_mappings+=("${env_name}=${secret_name}:latest")
          }

          sync_secret openrouter-api-key OPENROUTER_API_KEY
          sync_secret adzuna-app-id ADZUNA_APP_ID
          sync_secret adzuna-app-key ADZUNA_APP_KEY
          sync_secret jooble-api-key JOOBLE_API_KEY
          sync_secret firecrawl-api-key FIRECRAWL_API_KEY
          sync_secret groq-api-key GROQ_API_KEY
          sync_secret gemini-api-key GEMINI_API_KEY
          sync_secret cerebras-api-key CEREBRAS_API_KEY
          sync_secret deepseek-api-key DEEPSEEK_API_KEY
          sync_secret crawl4ai-api-token CRAWL4AI_API_TOKEN

          # CRAWL4AI_URL comes from the "Deploy Crawl4AI renderer" step above
          # when it ran, or from vars.CRAWL4AI_URL as a fallback (e.g. a repo
          # that set DISABLE_CRAWL4AI but still has a renderer deployed
          # separately, or a rerun that skips redeploying it).
          crawl4ai_url="${CRAWL4AI_URL:-${{ vars.CRAWL4AI_URL }}}"

          secret_csv="$(IFS=,; printf '%s' "${secret_mappings[*]}")"
          worker_env_vars="SUPABASE_URL=${SUPABASE_URL},OPENROUTER_MODEL=openrouter/free"
          if [ -n "$crawl4ai_url" ]; then worker_env_vars="${worker_env_vars},CRAWL4AI_URL=${crawl4ai_url}"; fi
          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --source pipeline \
            --service-account "$runtime_service_account" \
            --allow-unauthenticated \
            --timeout 600 \
            --concurrency 1 \
            --max-instances 1 \
            --set-env-vars "$worker_env_vars" \
            --update-secrets "$secret_csv"

      - name: Verify deployed worker is reachable
        shell: bash
        run: |
          set -euo pipefail
          worker_url="$(gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --format='value(status.url)')"
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST "${worker_url}/discover")"
          test "$status" = "401"
