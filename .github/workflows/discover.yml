name: Nightly opportunity discovery

on:
  schedule:
    - cron: '30 20 * * *'   # 02:00 IST
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run discovery or enrich existing opportunities'
        required: true
        type: choice
        default: discovery
        options:
          - discovery
          - search
          - backfill
      query:
        description: 'Extra search terms for a discovery run'
        required: false
      batchSize:
        description: 'Opportunities to enrich in backfill mode (1-100)'
        required: false
        default: '5'
      refreshExisting:
        description: 'Regenerate context that already exists'
        required: false
        type: boolean
        default: false
      maxLlmCalls:
        description: 'LLM call cap for this run'
        required: false
        default: '15'

permissions:
  contents: write            # heartbeat commit only, see the last step
  id-token: write            # only used to mint the Crawl4AI identity token below

concurrency:
  group: discovery
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pipeline/package-lock.json

      - name: Install
        working-directory: pipeline
        run: npm ci --no-audit --no-fund

      - name: Build
        working-directory: pipeline
        run: npm run build

      # crawl4ai-renderer is IAM-authenticated (see deploy-discovery-worker.yml),
      # and this run -- unlike the Cloud Run worker -- has no GCP metadata
      # server to mint a token from automatically, since it's a plain GitHub
      # Actions runner. Mint one explicitly via the same Workload Identity
      # Federation provider the deploy workflow already uses, scoped to
      # CRAWL4AI_URL as its audience. Skips cleanly (empty token, tier just
      # unused this run) if CRAWL4AI_URL or the GCP identity vars aren't set.
      #
      # continue-on-error on all three steps is deliberate: this whole block
      # exists only for an optional, best-effort render tier. A live failure
      # here (e.g. "Invalid account type for --audiences" the first time
      # this ran, before --impersonate-service-account was added below) once
      # took the entire nightly discovery run down with it via set -e,
      # despite having nothing to do with actual discovery/enrichment. An
      # empty token just means Crawl4AI's calls fail fast and fall through
      # to Firecrawl -- the same safe degradation as if it weren't
      # configured at all.
      - id: crawl4ai_auth
        if: vars.CRAWL4AI_URL != '' && vars.GCP_PROJECT_ID != '' && vars.GCP_SERVICE_ACCOUNT != ''
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2
        if: vars.CRAWL4AI_URL != '' && vars.GCP_PROJECT_ID != '' && vars.GCP_SERVICE_ACCOUNT != ''
        continue-on-error: true

      - id: crawl4ai_token
        if: vars.CRAWL4AI_URL != '' && vars.GCP_PROJECT_ID != '' && vars.GCP_SERVICE_ACCOUNT != ''
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          # A Workload Identity Federation principal can't mint an
          # audience-scoped ID token directly -- it has to impersonate the
          # target service account, which this workflow's WIF provider is
          # already authorized to do (see deploy-discovery-worker.yml's own
          # IAM setup).
          token="$(gcloud auth print-identity-token \
            --impersonate-service-account="${{ vars.GCP_SERVICE_ACCOUNT }}" \
            --audiences="${{ vars.CRAWL4AI_URL }}")"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Discover or backfill
        working-directory: pipeline
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MODE: ${{ github.event.inputs.mode || 'discovery' }}
          INPUT_QUERY: ${{ github.event.inputs.query || '' }}
          INPUT_BATCH: ${{ github.event.inputs.batchSize || '5' }}
          INPUT_REFRESH: ${{ github.event.inputs.refreshExisting || 'false' }}
          INPUT_MAX_LLM: ${{ github.event.inputs.maxLlmCalls || '15' }}
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DISCOVERY_USER_ID: ${{ vars.DISCOVERY_USER_ID }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          # This cron run never goes through the Cloud Run deploy workflow,
          # so it can't look up crawl4ai-renderer's URL dynamically -- set
          # CRAWL4AI_URL as a repo variable once, after deploy-discovery-
          # worker.yml's "Deploy Crawl4AI renderer" step first prints it.
          CRAWL4AI_URL: ${{ vars.CRAWL4AI_URL }}
          CRAWL4AI_API_TOKEN: ${{ steps.crawl4ai_token.outputs.token }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: openrouter/free
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          TRIGGER="schedule"
          MODE="discovery"
          BATCH="5"
          REFRESH="false"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TRIGGER="manual"
            MODE="$INPUT_MODE"
            BATCH="$INPUT_BATCH"
            REFRESH="$INPUT_REFRESH"
          fi
          ARGS=(
            run
            --trigger "$TRIGGER"
            --mode "$MODE"
            --query "$INPUT_QUERY"
            --max-llm "$INPUT_MAX_LLM"
            --context-batch "$BATCH"
          )
          if [ "$REFRESH" = "true" ]; then ARGS+=(--refresh-context); fi
          node dist/src/cli.js "${ARGS[@]}"

      - name: Keep the schedule alive
        if: github.event_name == 'schedule'
        run: |
          # GitHub disables scheduled workflows on public repos after 60 days of
          # repository inactivity. A commit under .github/ resets that clock and
          # is excluded from the Pages artifact, so it never touches the public site.
          LAST=$(git log -1 --format=%ct)
          NOW=$(date +%s)
          if [ $((NOW - LAST)) -gt 2592000 ]; then
            date -u +%FT%TZ > .github/discovery-heartbeat
            git config user.name "discovery-bot"
            git config user.email "discovery-bot@users.noreply.github.com"
            git add .github/discovery-heartbeat
            git commit -m "chore: discovery heartbeat"
            git push
          fi
