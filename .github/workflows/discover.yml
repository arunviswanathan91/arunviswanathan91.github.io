name: Nightly opportunity discovery

on:
  schedule:
    - cron: '30 20 * * *'   # 02:00 IST
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run discovery or enrich existing opportunities'
        required: true
        type: choice
        default: discovery
        options:
          - discovery
          - search
          - backfill
      query:
        description: 'Extra search terms for a discovery run'
        required: false
      batchSize:
        description: 'Opportunities to enrich in backfill mode (1-100)'
        required: false
        default: '5'
      refreshExisting:
        description: 'Regenerate context that already exists'
        required: false
        type: boolean
        default: false
      maxLlmCalls:
        description: 'LLM call cap for this run'
        required: false
        default: '15'

permissions:
  contents: write            # heartbeat commit only, see the last step

concurrency:
  group: discovery
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pipeline/package-lock.json

      - name: Install
        working-directory: pipeline
        run: npm ci --no-audit --no-fund

      - name: Build
        working-directory: pipeline
        run: npm run build

      - name: Discover or backfill
        working-directory: pipeline
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MODE: ${{ github.event.inputs.mode || 'discovery' }}
          INPUT_QUERY: ${{ github.event.inputs.query || '' }}
          INPUT_BATCH: ${{ github.event.inputs.batchSize || '5' }}
          INPUT_REFRESH: ${{ github.event.inputs.refreshExisting || 'false' }}
          INPUT_MAX_LLM: ${{ github.event.inputs.maxLlmCalls || '15' }}
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DISCOVERY_USER_ID: ${{ vars.DISCOVERY_USER_ID }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: openrouter/free
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          TRIGGER="schedule"
          MODE="discovery"
          BATCH="5"
          REFRESH="false"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TRIGGER="manual"
            MODE="$INPUT_MODE"
            BATCH="$INPUT_BATCH"
            REFRESH="$INPUT_REFRESH"
          fi
          ARGS=(
            run
            --trigger "$TRIGGER"
            --mode "$MODE"
            --query "$INPUT_QUERY"
            --max-llm "$INPUT_MAX_LLM"
            --context-batch "$BATCH"
          )
          if [ "$REFRESH" = "true" ]; then ARGS+=(--refresh-context); fi
          node dist/src/cli.js "${ARGS[@]}"

      - name: Keep the schedule alive
        if: github.event_name == 'schedule'
        run: |
          # GitHub disables scheduled workflows on public repos after 60 days of
          # repository inactivity. A commit under .github/ resets that clock and
          # is excluded from the Pages artifact, so it never touches the public site.
          LAST=$(git log -1 --format=%ct)
          NOW=$(date +%s)
          if [ $((NOW - LAST)) -gt 2592000 ]; then
            date -u +%FT%TZ > .github/discovery-heartbeat
            git config user.name "discovery-bot"
            git config user.email "discovery-bot@users.noreply.github.com"
            git add .github/discovery-heartbeat
            git commit -m "chore: discovery heartbeat"
            git push
          fi
